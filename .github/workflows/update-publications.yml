
name: Update publications

on:
  schedule:
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "bibtexparser==1.4.3"
          python -m pip check

      - name: Verify scholarly import
        run: |
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase; print('Imports successful')"

      - name: Generate publication page
        run: python scripts/update_publications.py

      - name: Commit updated publication page
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add _pages/publication.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update publications"
            git push
          fi
