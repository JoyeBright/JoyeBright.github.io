
name: Update publications

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday, 06:23 UTC
    - cron: '23 6 * * 1,4'

permissions:
  contents: write

concurrency:
  group: publication-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install updater dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Update publications and cache
        env:
          CROSSREF_CONTACT_EMAIL: ${{ secrets.CROSSREF_CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_AUTHOR_ID: ${{ vars.OPENALEX_AUTHOR_ID }}
        run: python scripts/update_publications.py

      - name: Commit updated page and cache
        run: |
          git add _pages/publication.md
          if [ -f _data/publication_cache.json ]; then
            git add _data/publication_cache.json
          fi
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update publications and citation cache'
          git push
