
name: Update publications

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday at 06:23 UTC
    - cron: '23 6 * * 1,4'

permissions:
  contents: write

concurrency:
  group: publication-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install scholarly PyYAML

      - name: Update publications and persistent cache
        env:
          CROSSREF_CONTACT_EMAIL: ${{ secrets.CROSSREF_CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_publications.py

      - name: Commit generated files if changed
        run: |
          git add _pages/publication.md _data/publication_cache.json
          if git diff --cached --quiet; then
            echo 'No publication changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update publications and cached Scholar metrics'
          git push
